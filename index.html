<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>استار · اکشن‌پلن فاز دوم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script>try{const t=localStorage.getItem('star-theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{
  --bg:#F6F4FB;--surface:#FFFFFF;--surface2:#FAF9FD;--line:#ECE8F5;--line2:#DDD7EE;
  --text:#17122B;--muted:#5E5878;--dim:#8E89A6;
  --accent:#6B3FE0;--accent-soft:#F1ECFF;--pink:#E0197D;--yel:#FFE401;
  --shadow:0 1px 2px rgba(23,18,43,.04),0 10px 28px rgba(23,18,43,.06);
  --track:#F1EEF8;--row-hover:#F6F2FF;--lane:#FAF8FE;
  --r:20px;color-scheme:light;
}
[data-theme="dark"]{
  --bg:#0E0B19;--surface:#171328;--surface2:#1C172F;--line:#28223F;--line2:#3A3357;
  --text:#F3F0FF;--muted:#B2ABCF;--dim:#7D769C;
  --accent:#9B7BFF;--accent-soft:#251D44;
  --shadow:0 1px 0 rgba(255,255,255,.02);
  --track:#221C38;--row-hover:#231C3D;--lane:#1B1630;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,system-ui,sans-serif;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
a{color:var(--accent)}
button{font-family:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:22px 28px 60px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:4px 0 22px}
.mark{display:flex;align-items:center;gap:10px;font-weight:900;direction:ltr}
.mark .st{font-size:24px;letter-spacing:.06em;color:var(--accent)}
.mark .x{color:var(--dim);font-weight:400}
.mark .lm{font-size:13px;letter-spacing:.2em;color:var(--text);background:linear-gradient(transparent 58%,var(--yel) 58%);padding:0 3px}
.tools{display:flex;align-items:center;gap:10px}
.live{display:flex;align-items:center;gap:9px;padding:7px 14px;border:1px solid var(--line2);border-radius:999px;background:var(--surface);font-size:12.5px;color:var(--muted)}
.live b{color:var(--text);font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:#22B573;box-shadow:0 0 0 0 rgba(34,181,115,.5);animation:pulse 2s infinite;flex:none}
.live.stale .dot{background:#E08A00;animation:none}.live.off .dot{background:var(--dim);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,181,115,.45)}70%{box-shadow:0 0 0 8px rgba(34,181,115,0)}100%{box-shadow:0 0 0 0 rgba(34,181,115,0)}}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);color:var(--text);display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.iconbtn svg{width:18px;height:18px}
.sep{display:inline-block;width:1px;height:11px;background:currentColor;opacity:.35;margin:0 8px;vertical-align:-1px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:24px}
.h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 18px}
.h h2{margin:0;font-size:18px;font-weight:800;display:flex;align-items:center;gap:10px}
.h h2 i{width:8px;height:22px;border-radius:4px;background:linear-gradient(var(--accent),var(--pink))}
.sub{color:var(--dim);font-size:12.5px}
.eyebrow{font-size:11.5px;letter-spacing:.12em;font-weight:800}
section{scroll-margin-top:84px;margin-bottom:20px}

/* hero */
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:20px}
.hero-main{border-radius:var(--r);padding:34px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(135deg,#3E1BA8 0%,#6B3FE0 55%,#B42A8E 100%)}
.hero-main::after{content:"";position:absolute;left:-70px;bottom:-90px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(255,228,1,.28),transparent 66%)}
.hero-main .eyebrow{color:var(--yel)}
.hero h1{font-size:44px;line-height:1.15;margin:8px 0 14px;font-weight:900}
.chips{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.hchip{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);font-size:12.5px}
.note{position:relative;z-index:1;margin-top:20px;padding:15px 18px;border-radius:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);font-size:14.5px;line-height:1.9}
.note .eyebrow{display:block;margin-bottom:4px;color:var(--yel)}
.hero-side{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;padding:28px 32px}
.ring{position:relative;width:184px;height:184px}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-size:50px;font-weight:900;line-height:1}
.ring .sm{color:var(--muted);font-size:12.5px;margin-top:6px}
.pmeta{display:grid;gap:12px}
.pm{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px dashed var(--line2);padding-bottom:10px}
.pm:last-child{border-bottom:0}
.pm span{color:var(--muted);font-size:13px}.pm b{font-size:18px;font-weight:800}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.kpi{padding:20px 22px}
.kpi .lab{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:8px}
.kpi .ico{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:13px}
.kpi .val{font-size:32px;font-weight:900;margin-top:6px;line-height:1.15}
.kpi .val small{font-size:14px;color:var(--muted);font-weight:500;margin-right:4px}
.kpi .foot{margin-top:10px;font-size:12px;color:var(--dim)}
.bar{height:7px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--pink));transition:width .8s cubic-bezier(.2,.8,.2,1)}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;position:sticky;top:10px;z-index:20}
.fgroup{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fbtn{border:1px solid var(--line2);background:var(--surface);color:var(--muted);padding:6px 13px;border-radius:999px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.fbtn:hover{color:var(--text);border-color:var(--accent)}
.fbtn.on{background:var(--text);color:var(--surface);border-color:var(--text);font-weight:700}
.fbtn .sw{width:8px;height:8px;border-radius:50%}
select,input[type=search]{font-family:inherit;font-size:12.5px;background:var(--surface2);border:1px solid var(--line2);color:var(--text);border-radius:999px;padding:7px 14px;outline:none}
select:focus,input:focus{border-color:var(--accent)}
input[type=search]{width:200px}
.nav{display:flex;gap:2px}
.nav button{background:none;border:0;color:var(--muted);font-size:12.5px;padding:6px 9px;border-radius:9px;cursor:pointer}
.nav button:hover{color:var(--text);background:var(--surface2)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:12px;padding:3px;background:var(--surface2)}
.seg button{border:0;background:none;color:var(--muted);padding:5px 13px;border-radius:9px;cursor:pointer;font-size:12.5px}
.seg button.on{background:var(--accent);color:#fff;font-weight:700}
.lnk{background:none;border:0;color:var(--accent);cursor:pointer;font-size:12.5px;padding:4px 6px;font-weight:600}

/* gantt */
.gscroll{overflow-x:auto;border-radius:14px;border:1px solid var(--line)}
.gantt{display:grid;grid-template-columns:300px 1fr;min-width:1040px}
.g-lab{border-left:1px solid var(--line);position:sticky;right:0;z-index:3;background:var(--surface)}
.g-time{position:relative;background:var(--surface)}
.g-head{height:50px;border-bottom:1px solid var(--line);position:relative;background:var(--surface2)}
.g-lab .g-head{display:flex;align-items:flex-end;padding:0 16px 9px;color:var(--dim);font-size:12px}
.g-wk{position:absolute;top:0;bottom:0;border-right:1px solid var(--line);padding:7px 8px 0;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden}
.g-wk b{display:block;color:var(--text);font-weight:700;font-size:11.5px}
.g-lane{height:44px;display:flex;align-items:center;gap:9px;padding:0 14px;font-weight:800;font-size:12.5px;border-bottom:1px solid var(--line);background:var(--lane);cursor:pointer;white-space:nowrap;overflow:hidden;user-select:none}
.g-lane:hover{background:var(--row-hover)}
.g-lane .chev{width:18px;height:18px;flex:none;color:var(--dim);transition:transform .2s}
.g-lane.closed .chev{transform:rotate(90deg)}
.g-lane .sw{width:10px;height:10px;border-radius:3px;flex:none}
.g-lane .nm{overflow:hidden;text-overflow:ellipsis}
.g-lane .cnt{margin-right:auto;flex:none;color:var(--dim);font-weight:600;font-size:11px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:0 8px}
.g-row{height:36px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px 0 14px;gap:8px;font-size:12.5px;cursor:pointer;white-space:nowrap;overflow:hidden}
.g-row .id{color:var(--dim);font-size:10.5px;direction:ltr;min-width:44px;font-feature-settings:"tnum"}
.g-row .t{overflow:hidden;text-overflow:ellipsis}
.g-row:hover,.g-row.hl,.g-trk:not(.lane):hover,.g-trk.hl{background:var(--row-hover)}
.g-trk{height:36px;border-bottom:1px solid var(--line);position:relative;cursor:pointer}
.g-trk.lane{height:44px;background:var(--lane);cursor:pointer}
.g-grid{position:absolute;inset:50px 0 0 0;pointer-events:none}
.g-grid i{position:absolute;top:0;bottom:0;border-right:1px solid var(--line)}
.g-phase{position:absolute;top:0;bottom:0;background:var(--accent-soft);opacity:.55}
.g-today{position:absolute;top:0;bottom:0;border-right:2px solid var(--pink);z-index:2}
.g-today span{position:absolute;top:-11px;right:-20px;background:var(--pink);color:#fff;font-weight:800;font-size:10px;padding:1px 7px;border-radius:6px;white-space:nowrap}
.g-bar{position:absolute;top:8px;height:20px;border-radius:7px;overflow:hidden;min-width:8px;background:color-mix(in srgb,var(--c) 28%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 55%,transparent)}
.g-bar .pf{position:absolute;top:0;bottom:0;right:0;background:var(--c)}
.g-bar .pl{position:absolute;inset:0;display:flex;align-items:center;padding:0 7px;font-size:10px;font-weight:800;color:var(--text);white-space:nowrap}
.g-bar.full .pl{color:#fff}
.g-span{position:absolute;top:9px;bottom:9px;border-radius:9px;background:color-mix(in srgb,var(--c) 10%,transparent);border:1px dashed color-mix(in srgb,var(--c) 45%,transparent)}
.g-mini{position:absolute;height:6px;border-radius:4px;background:var(--c)}
.g-ms{position:absolute;top:10px;width:15px;height:15px;transform:translateX(50%) rotate(45deg);background:var(--yel);border:2px solid #C9A800;border-radius:3px}
.undated{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.undated b{color:var(--text)}
.uchip{border:1px dashed var(--line2);background:var(--surface2);border-radius:10px;padding:4px 10px;cursor:pointer;font-size:12px;color:var(--text)}
.uchip:hover{border-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;color:var(--muted);font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;background:color-mix(in srgb,var(--c) 13%,var(--surface));color:color-mix(in srgb,var(--c) 78%,var(--text));border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}

/* calendar: always a light paper sheet */
.paper{--surface:#FFFFFF;--surface2:#FBFAFE;--line:#EEEAF6;--line2:#DFD9EF;--text:#17122B;--muted:#5E5878;--dim:#8E89A6;--accent:#6B3FE0;--accent-soft:#F1ECFF;
  background:#FFFDF8;color:var(--text);border:1px solid #EFE8DA;border-radius:var(--r);padding:26px;color-scheme:light;
  background-image:radial-gradient(circle at 100% 0,#FFF3C4 0,transparent 32%),radial-gradient(circle at 0 100%,#FDE3F0 0,transparent 30%);box-shadow:0 1px 2px rgba(23,18,43,.04),0 14px 34px rgba(80,50,10,.07)}
.cal-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.cal-head h2{margin:0;font-size:22px;font-weight:900}
.cal-head .sub{margin-top:2px}
.cal-legend{display:flex;flex-wrap:wrap;gap:8px}
.cal-legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);padding:3px 10px;border-radius:99px}
.cal-legend i{width:8px;height:8px;border-radius:50%}
.cal-month{grid-column:1/-1;display:flex;align-items:center;gap:12px;margin:14px 0 0;font-weight:900;font-size:15px}
.cal-month::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,#E6DFCF)}
.cal-month small{font-weight:600;color:var(--dim);font-size:12px}
.cal-days{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:16px;align-items:start}
.cal-day{background:rgba(255,255,255,.72);border:1px solid #EEE7D8;border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:10px}
.cal-date{display:flex;align-items:center;gap:12px;padding:4px 6px 2px}
.cal-date b{font-size:34px;line-height:1;font-weight:900;color:var(--accent);min-width:44px;text-align:center}
.cal-date span{display:block;font-size:13px;color:var(--text);font-weight:800}
.cal-date small{display:block;font-size:11.5px;color:var(--dim)}
.cal-date em{margin-right:auto;font-style:normal;font-size:11px;font-weight:800;color:#fff;background:var(--pink);padding:2px 9px;border-radius:99px}
.cal-day.today{background:linear-gradient(160deg,#F3EEFF,#FFEAF4);border-color:#D9CCFF;box-shadow:0 10px 26px rgba(107,63,224,.14)}
.cal-day.past{opacity:.55}
.cal-items{display:grid;gap:10px}
.cal-item{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 12px;cursor:pointer;transition:.18s;overflow:hidden}
.cal-item::before{content:"";position:absolute;top:0;bottom:0;right:0;width:5px;background:var(--c)}
.cal-item:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(23,18,43,.09);border-color:color-mix(in srgb,var(--c) 40%,#fff)}
.cal-item .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-bottom:6px}
.cal-item .ch{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:color-mix(in srgb,var(--c) 80%,#17122B)}
.cal-item .ch i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.cal-item .fm{background:color-mix(in srgb,var(--c) 10%,#fff);color:color-mix(in srgb,var(--c) 75%,#17122B);padding:1px 8px;border-radius:99px;font-weight:600}
.cal-item .tm{margin-right:auto;direction:ltr;color:var(--dim)}
.cal-item h4{margin:0 0 4px;font-size:14px;font-weight:800;line-height:1.6}
.cal-item p{margin:0 0 10px;font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cal-more{display:flex;justify-content:center;margin-top:6px}
.cal-more button{border:1px solid #E6DFCF;background:#fff;color:var(--muted);border-radius:99px;padding:7px 16px;cursor:pointer;font-size:12.5px}
.cal-more button:hover{color:var(--accent);border-color:var(--accent)}
.cal-empty{padding:28px;text-align:center;color:var(--dim);border:1px dashed #E6DFCF;border-radius:16px;background:#fff;margin-top:16px}

/* week + budget */
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.wk-list{display:grid;gap:10px}
.wk-item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 14px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);cursor:pointer;transition:.15s}
.wk-item:hover{border-color:var(--accent)}
.wk-item .stp{width:4px;align-self:stretch;border-radius:4px}
.wk-item .tt{font-weight:700;font-size:13.5px}
.wk-item .mt{color:var(--dim);font-size:11.5px}
.empty{color:var(--dim);font-size:13px;padding:18px;text-align:center;border:1px dashed var(--line2);border-radius:14px}
.bud{display:grid;grid-template-columns:1fr 1fr;gap:20px 36px}
.bud-row .t2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.bud-row .nm{font-weight:700;display:flex;align-items:center;gap:8px;font-size:13.5px}
.bud-row .nm .sw{width:10px;height:10px;border-radius:3px;flex:none}
.bud-row .nums{color:var(--muted);font-size:12.5px;white-space:nowrap}
.bud-row .nums b{color:var(--text)}
.bbar{height:10px;border-radius:99px;background:var(--track);overflow:hidden;position:relative}
.bbar i{position:absolute;top:0;bottom:0;right:0;border-radius:99px;transition:width .8s}
.bsum{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
.bs{background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.bs .lab{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;font-weight:600}
.bs .lab i{width:10px;height:10px;border-radius:3px}
.bs b{display:block;font-size:26px;font-weight:900;margin:6px 0 2px}
.bs small{color:var(--dim);font-size:12px}
.upd{font-size:11.5px;color:var(--dim);background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:1px 9px;white-space:nowrap}
.bbar3{height:12px;border-radius:99px;background:var(--track);border:1px solid var(--line);overflow:hidden;position:relative}
.bbar3 i{position:absolute;top:0;bottom:0;right:0;border-radius:99px;transition:width .8s}
.bbar3 .rec{background:color-mix(in srgb,#2F6FEB 45%,var(--surface))}
.bbar3 .sp{background:#E08A00;top:3px;bottom:3px}
.nums3{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
.nums3 b{color:var(--text)}
.bud-total{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.bud-total div{text-align:center}
.bud-total span{display:block;color:var(--muted);font-size:12px}
.bud-total b{font-size:21px;font-weight:900}

/* board + table */
.board{display:grid;grid-template-columns:repeat(6,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:12px;min-height:150px;max-height:640px;overflow-y:auto;scrollbar-width:thin}
.col h3{margin:0 0 10px;font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:6px}
.col h3 .n{color:var(--dim);font-weight:600}
.col h3 .lb{display:flex;align-items:center;gap:7px}
.col h3 .lb i{width:8px;height:8px;border-radius:50%}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:9px;cursor:pointer;transition:.15s}
.tcard:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.tcard .pill{white-space:normal;font-size:11px}
.tcard .tt{font-weight:700;font-size:12.5px;line-height:1.6}
.tcard .sm{color:var(--dim);font-size:11px;margin-top:2px}
.tcard .mt{display:flex;justify-content:space-between;align-items:center;gap:6px;color:var(--dim);font-size:11px;margin-top:8px}
.tcard .mini{height:4px;border-radius:9px;background:var(--track);margin-top:8px;overflow:hidden}
.tcard .mini i{display:block;height:100%;background:var(--c)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:940px}
th{text-align:right;color:var(--dim);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line2);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--text)}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--row-hover)}
td.num{font-feature-settings:"tnum"}
.prog{display:flex;align-items:center;gap:8px}.prog .bar{width:70px;margin:0;height:5px}

/* drawer, toast, tip */
.scrim{position:fixed;inset:0;background:rgba(14,10,30,.38);opacity:0;pointer-events:none;transition:.25s;z-index:50}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(460px,100%);background:var(--surface);border-right:1px solid var(--line2);z-index:51;transform:translateX(-102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);overflow-y:auto;padding:26px;box-shadow:20px 0 60px rgba(14,10,30,.18)}
.drawer.on{transform:none}
.drawer .x{position:absolute;top:18px;left:18px;width:34px;height:34px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);color:var(--text);cursor:pointer;font-size:18px}
.drawer h3{font-size:21px;margin:12px 0 12px;line-height:1.45;font-weight:800}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.dgrid div{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.dgrid span{display:block;color:var(--dim);font-size:11.5px}.dgrid b{font-size:13.5px;font-weight:700}
.dnote{background:var(--accent-soft);border-radius:14px;padding:14px;line-height:1.9}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,30px);opacity:0;background:var(--text);color:var(--surface);padding:10px 18px;border-radius:14px;font-size:13px;z-index:60;transition:.3s;display:flex;gap:9px;align-items:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.tip{position:fixed;pointer-events:none;z-index:70;background:var(--text);color:var(--surface);border-radius:12px;padding:9px 12px;font-size:12px;max-width:280px;opacity:0;transition:opacity .12s}
.tip.on{opacity:1}.tip b{display:block;font-size:12.5px;margin-bottom:2px}
.state{padding:70px 20px;text-align:center;color:var(--muted)}
.spin{width:36px;height:36px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--accent);margin:0 auto 16px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--dim);font-size:12px;margin-top:30px;padding-top:18px;border-top:1px solid var(--line)}

@media (max-width:1000px){
  .hero,.two{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .bud{grid-template-columns:1fr}
  .bsum{grid-template-columns:1fr}
  .hero-side{grid-template-columns:1fr;justify-items:center}
  .pmeta{width:100%}
  .nav{display:none}
}
@media (max-width:560px){
  .wrap{padding:14px 12px 40px}
  .hero h1{font-size:32px}
  .hero-main,.hero-side{padding:22px}
  .kpis{gap:12px}.kpi{padding:16px}.kpi .val{font-size:25px}
  .pad,.paper{padding:18px}
  input[type=search]{width:100%}
  .filters{position:static}
  .live .full{display:none}
  .gantt{grid-template-columns:150px 1fr;min-width:860px}
  .g-row .id,.g-lane .cnt{display:none}
  .cal-days{grid-template-columns:1fr}
}

<script>
/* ---------- helpers ---------- */
const MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const WD=['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
const fa=n=>(n==null||n==='')?'':Number(n).toLocaleString('fa-IR');
const faD=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);

const num=v=>{if(v==null||v==='')return null;const n=Number(enD(v).replace(/[,٬\s]/g,''));return isFinite(n)?n:null};
const SEP='<span class="sep"></span>';
function j2g(jy,jm,jd){jy+=1595;let days=-355668+(365*jy)+(~~(jy/33)*8)+~~(((jy%33)+3)/4)+jd+((jm<7)?(jm-1)*31:((jm-7)*30)+186);let gy=400*~~(days/146097);days%=146097;if(days>36524){gy+=100*~~(--days/36524);days%=36524;if(days>=365)days++;}gy+=4*~~(days/1461);days%=1461;if(days>365){gy+=~~((days-1)/365);days=(days-1)%365;}let gd=days+1;const sal=[0,31,((gy%4===0&&gy%100!==0)||(gy%400===0))?29:28,31,30,31,30,31,31,30,31,30,31];let gm;for(gm=0;gm<13&&gd>sal[gm];gm++)gd-=sal[gm];return[gy,gm,gd];}
function g2j(gy,gm,gd){const m=[0,31,59,90,120,151,181,212,243,273,304,334];let gy2=(gm>2)?(gy+1):gy;let days=355666+(365*gy)+~~((gy2+3)/4)-~~((gy2+99)/100)+~~((gy2+399)/400)+gd+m[gm-1];let jy=-1595+(33*~~(days/12053));days%=12053;jy+=4*~~(days/1461);days%=1461;if(days>365){jy+=~~((days-1)/365);days=(days-1)%365;}let jm,jd;if(days<186){jm=1+~~(days/31);jd=1+(days%31);}else{jm=7+~~((days-186)/30);jd=1+((days-186)%30);}return[jy,jm,jd];}
function jday(s){if(!s)return null;const p=enD(s).trim().split(/[\/\-.]/).map(Number);if(p.length!==3||p.some(isNaN)||!p[0])return null;let[y,m,d]=p;if(y<100)y+=1400;const g=j2g(y,m,d);return Math.round(Date.UTC(g[0],g[1]-1,g[2])/864e5)}
function dayJ(n){const d=new Date(n*864e5);return g2j(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate())}
function fmtDay(n){const[,m,d]=dayJ(n);return `${fa(d)} ${MONTHS[m-1]}`}
function todayN(){try{const s=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tehran',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const[y,m,d]=s.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)}catch(e){return Math.floor(Date.now()/864e5)}}
const wday=n=>new Date(n*864e5).getUTCDay();

function money(v){if(v==null)return '—';const a=Math.abs(v);if(a>=1e9)return faD((v/1e9).toFixed(2).replace(/\.?0+$/,''))+' میلیارد';if(a>=1e6)return faD((v/1e6).toFixed(a>=1e8?0:1).replace(/\.0$/,''))+' میلیون';return fa(v)}

function colorMap(){
  const m={},put=n=>{if(n&&!(n in m))m[n]=PAL[Object.keys(m).length%PAL.length]};
  return{m,put};
}
function streamsList(){
  const list=(S.streams||[]).slice().sort((a,b)=>(a.order??99)-(b.order??99));
  const names=new Set(list.map(s=>s.name));
  (S.actions||[]).forEach(a=>{const n=a.stream||'سایر';if(!names.has(n)){names.add(n);list.push({name:n,order:99})}});
  return list.map((s,i)=>({...s,color:PAL[i%PAL.length]}));
}
let CH={};
function buildChannelColors(){const c=colorMap();(S.calendar||[]).forEach(x=>c.put(x.channel||'سایر'));(S.actions||[]).forEach(x=>c.put(x.channel||'سایر'));CH=c.m}

function visActions(){
  return (S.actions||[]).filter(a=>a.status!=='لغو').map(a=>{const x={...a,stream:a.stream||'سایر',channel:a.channel||'',s:jday(a.start),e:jday(a.end),p:Math.max(0,Math.min(100,num(a.progress)||0)),bud:num(a.budget),rec:num(a.received),sp:num(a.spent)};if(x.s==null&&x.e!=null)x.s=x.e;if(x.e==null)x.e=x.s;if(x.s!=null&&x.e<x.s){const t=x.s;x.s=x.e;x.e=t}return x});
}
function filtered(list){
  const f=S.filter,q=f.q.trim();
  return list.filter(a=>(f.stream==='all'||a.stream===f.stream)&&(f.status==='all'||groupOf(a.status)===f.status)&&(!q||[a.id,a.title,a.stream,a.channel,a.type,a.owner,a.note].join(' ').includes(q)));
}
const durOf=a=>a.s!=null?Math.max(1,a.e-a.s+1):1;

/* ---------- render ---------- */
const $=id=>document.getElementById(id);
function render(){
  const root=$('root');

  const bRows=streams.map(s=>{const acts=all.filter(a=>a.stream===s.name);const sum=k=>acts.reduce((t,a)=>t+(a[k]||0),0);return{...s,bud:num(s.budget)??(sum('bud')||null),rec:num(s.received)??sum('rec'),spent:num(s.spent)??sum('sp')}});
  const tBud=bRows.reduce((t,r)=>t+(r.bud||0),0),tRec=bRows.reduce((t,r)=>t+(r.rec||0),0),tSp=bRows.reduce((t,r)=>t+(r.spent||0),0);const PC=(a,b)=>b?Math.min(100,a/b*100):0;

        <circle cx="92" cy="92" r="76" fill="none" stroke="var(--track)" stroke-width="13"/>
        <circle cx="92" cy="92" r="76" fill="none" stroke="url(#rg)" stroke-width="13" stroke-linecap="round" stroke-dasharray="${R}" stroke-dashoffset="${R*(1-ringP)}" style="transition:stroke-dashoffset 1.2s"/></svg>
        <div class="c"><div class="big">${big}</div><div class="sm">${sm}</div></div></div>
      <div class="pmeta">
        <div class="pm"><span>امروز</span><b>${fmtDay(T)}</b></div>

  </section>

  ${showBud?`<section class="card pad" id="sec-bud"><div class="h"><h2><i></i>بودجه</h2><span class="sub">به تومان</span></div>
    <div class="bsum">
      <div class="bs"><span class="lab"><i style="background:var(--line2)"></i>بودجه‌ی مصوب مدیریت</span><b>${money(tBud)}</b><small>سقف هزینه‌ی تاییدشده‌ی فاز</small></div>
      <div class="bs"><span class="lab"><i style="background:color-mix(in srgb,#2F6FEB 45%,var(--surface))"></i>دریافتی / واریزی</span><b>${money(tRec)}</b><small>${pct(PC(tRec,tBud))} از بودجه‌ی مصوب${tBud>tRec?SEP+'مانده '+money(tBud-tRec):''}</small></div>
      <div class="bs"><span class="lab"><i style="background:#E08A00"></i>هزینه‌کرد واقعی</span><b>${money(tSp)}</b><small>${pct(PC(tSp,tBud))} از مصوب${tRec?SEP+pct(PC(tSp,tRec))+' از دریافتی':''}</small></div>
    </div>
    <div class="bud">${bRows.map(r=>{const upd=jday(r.spentUpdated);return`<div class="bud-row"><div class="t2"><span class="nm"><span class="sw" style="background:${r.color}"></span>${esc(r.name)}</span>${r.cadence||upd!=null?`<span class="upd">${r.cadence?esc(r.cadence):''}${r.cadence&&upd!=null?SEP:''}${upd!=null?'به‌روز تا '+fmtDay(upd):''}</span>`:''}</div>
      <div class="bbar3"><i class="rec" style="width:${PC(r.rec||0,r.bud)}%"></i><i class="sp" style="width:${PC(r.spent||0,r.bud)}%"></i></div>
      <div class="nums3"><span>مصوب <b>${r.bud?money(r.bud):'—'}</b></span><span>دریافتی <b>${money(r.rec||0)}</b></span><span>هزینه‌کرد <b>${money(r.spent||0)}</b></span></div></div>`}).join('')}</div>
    <div class="legend" style="margin-top:18px"><span><i style="background:var(--track);border:1px solid var(--line2)"></i>بودجه‌ی مصوب</span><span><i style="background:color-mix(in srgb,#2F6FEB 45%,var(--surface))"></i>دریافتی</span><span><i style="background:#E08A00"></i>هزینه‌کرد واقعی</span><span style="color:var(--dim)">هزینه‌کرد تبلیغات هوشمند روزانه و سوشال هفتگی به‌روز می‌شود</span></div>
  </section>`:''}

  <section class="card pad" id="sec-act">
    <div class="h"><h2><i></i>همه‌ی اکشن‌ها</h2><div class="seg"><button data-view="board" class="${S.view==='board'?'on':''}">بُرد</button><button data-view="table" class="${S.view==='table'?'on':''}">جدول</button></div></div>
    <div id="acts"></div>

function renderDynamic(){
  const all=visActions(),list=filtered(all),m=S.meta||{},T=todayN(),showBud=m.showBudget!==false;
  renderGantt(list,m,T);
  renderCal(T);
  const w1=satOf(T),w2=w1+7;
  $('wk1').textContent=`${fmtDay(w1)} تا ${fmtDay(w1+6)}`;$('wk2').textContent=`${fmtDay(w2)} تا ${fmtDay(w2+6)}`;
  const wk=ws=>{const l=list.filter(a=>a.s!=null&&a.s<=ws+6&&a.e>=ws).sort((a,b)=>a.s-b.s);return l.length?l.map(a=>`<div class="wk-item" data-id="${esc(a.id)}"><span class="stp" style="background:${stColor(a.status)}"></span><div><div class="tt">${esc(a.title)}</div><div class="mt">${esc(a.stream)}${SEP}${fmtDay(a.s)}${a.e!==a.s?' تا '+fmtDay(a.e):''}</div></div><span class="pill" style="--c:${stColor(a.status)}">${esc(a.status||'—')}</span></div>`).join(''):'<div class="empty">اکشنی در این بازه نیست</div>'};
  $('thisWeek').innerHTML=wk(w1);$('nextWeek').innerHTML=wk(w2);
  const el=$('acts');
  if(!list.length){el.innerHTML='<div class="empty">با این فیلترها اکشنی پیدا نشد</div>';return}
  if(S.view==='board'){
    el.innerHTML=`<div class="board">${GROUPS.map(g=>{const l=list.filter(a=>groupOf(a.status)===g.k).sort((a,b)=>(a.s??1e9)-(b.s??1e9));return`<div class="col"><h3><span class="lb"><i style="background:${g.c}"></i>${g.t}</span><span class="n">${fa(l.length)}</span></h3>${l.map(a=>`<div class="tcard" data-id="${esc(a.id)}" style="--c:${stColor(a.status)}"><div class="tt">${esc(a.title)}</div><div class="sm">${esc(a.stream)}</div>${g.s.length>1?`<div style="margin-top:7px"><span class="pill" style="--c:${stColor(a.status)}">${esc(a.status)}</span></div>`:''}<div class="mt"><span>${a.s!=null?fmtDay(a.s):'بدون تاریخ'}</span><span>${pct(a.p)}</span></div><div class="mini"><i style="width:${a.p}%"></i></div></div>`).join('')}</div>`}).join('')}</div>`;
  }else{
    const k=S.sort.k,d=S.sort.d;
    const key={id:a=>a.id,title:a=>a.title,stream:a=>a.stream,channel:a=>a.channel,start:a=>a.s??1e9,status:a=>GROUPS.findIndex(g=>g.k===groupOf(a.status)),p:a=>a.p,bud:a=>a.bud??-1,rec:a=>a.rec??-1,sp:a=>a.sp??-1}[k]||(a=>a.s);
    const l=list.slice().sort((a,b)=>{const x=key(a),y=key(b);return(x>y?1:x<y?-1:0)*d});
    const cols=[['id','شناسه'],['title','عنوان'],['stream','جریان کار'],['channel','کانال'],['start','بازه'],['status','وضعیت'],['p','پیشرفت']].concat(showBud?[['bud','مصوب'],['rec','دریافتی'],['sp','هزینه‌کرد']]:[]);
    el.innerHTML=`<div class="tbl"><table><thead><tr>${cols.map(c=>`<th data-sort="${c[0]}">${c[1]}${k===c[0]?(d>0?' ▴':' ▾'):''}</th>`).join('')}</tr></thead><tbody>${l.map(a=>`<tr data-id="${esc(a.id)}"><td class="num" dir="ltr" style="text-align:right">${esc(a.id)}</td><td>${esc(a.title)}</td><td>${esc(a.stream)}</td><td>${esc(a.channel)}</td><td>${a.s!=null?fmtDay(a.s)+(a.e!==a.s?' تا '+fmtDay(a.e):''):'—'}</td><td><span class="pill" style="--c:${stColor(a.status)}">${esc(a.status||'—')}</span></td><td><div class="prog"><div class="bar"><i style="width:${a.p}%"></i></div>${pct(a.p)}</div></td>${showBud?`<td class="num">${a.bud!=null?money(a.bud):'—'}</td><td class="num">${a.rec!=null?money(a.rec):'—'}</td><td class="num">${a.sp!=null?money(a.sp):'—'}</td>`:''}</tr>`).join('')}</tbody></table></div>`;
  }
}

/* ---------- roadmap ---------- */
const CHEV='<svg class="chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8l4 4 4-4"/></svg>';
function laneGroups(list){
  if(S.by==='channel'){const keys=[];list.forEach(a=>{const k=a.channel||'بدون کانال';if(!keys.includes(k))keys.push(k)});return keys.map(k=>({key:k,color:chColor(k),items:list.filter(a=>(a.channel||'بدون کانال')===k)}))}
  return streamsList().map(s=>({key:s.name,color:s.color,items:list.filter(a=>a.stream===s.name)})).filter(g=>g.items.length);
}
function pack(items,max){const ends=[];return items.map(a=>{let r=ends.findIndex(e=>e<a.s);if(r===-1){r=ends.length<max?ends.length:ends.indexOf(Math.min(...ends))}ends[r]=a.e;return r})}
function renderGantt(list,m,T){
  const el=$('gantt');
  const dated=list.filter(a=>a.s!=null),undated=list.filter(a=>a.s==null);
  const ps=jday(m.start),pe=jday(m.end);
  if(!dated.length&&ps==null){el.innerHTML='<div class="empty">برای اکشن‌ها هنوز تاریخ ثبت نشده</div>';return}
  let lo=Math.min(...dated.map(a=>a.s),ps??Infinity,T),hi=Math.max(...dated.map(a=>a.e),pe??-Infinity,T);
  lo=satOf(lo);hi=satOf(hi)+6;
  const span=hi-lo+1,X=n=>(n-lo)/span*100,W=(s,e)=>(e-s+1)/span*100;
  const groups=laneGroups(dated);
  if(S.closed==null)S.closed=new Set((dated.length>22||innerWidth<700)?groups.map(g=>g.key):[]);
  let L='<div class="g-head">اکشن</div>',R='';
  groups.forEach(g=>{
    const items=g.items.slice().sort((a,b)=>a.s-b.s||String(a.id).localeCompare(b.id));
    const closed=S.closed.has(g.key);
    const mn=Math.min(...items.map(a=>a.s)),mx=Math.max(...items.map(a=>a.e));
    const avg=items.reduce((t,a)=>t+a.p*durOf(a),0)/(items.reduce((t,a)=>t+durOf(a),0)||1);
    L+=`<div class="g-lane ${closed?'closed':''}" data-lane="${esc(g.key)}">${CHEV}<span class="sw" style="background:${g.color}"></span><span class="nm">${esc(g.key)}</span><span class="cnt">${fa(items.length)} اکشن${SEP}${pct(avg)}</span></div>`;
    let lane=`<div class="g-span" style="--c:${g.color};right:${X(mn)}%;width:${W(mn,mx)}%"></div>`;
    if(closed){const rows=pack(items,4),n=Math.max(...rows)+1,h=n>2?5:6,gap=2,top=(44-(n*h+(n-1)*gap))/2;
      lane+=items.map((a,i)=>`<div class="g-mini" title="${esc(a.title)}" style="--c:${stColor(a.status)};right:${X(a.s)}%;width:${W(a.s,a.e)}%;top:${top+rows[i]*(h+gap)}px;height:${h}px"></div>`).join('');}
    R+=`<div class="g-trk lane" data-lane="${esc(g.key)}">${lane}</div>`;
    if(!closed)items.forEach(a=>{
      const c=stColor(a.status);
      L+=`<div class="g-row" data-id="${esc(a.id)}"><span class="id">${esc(a.id)}</span><span class="t">${esc(a.title)}</span></div>`;
      R+=`<div class="g-trk" data-id="${esc(a.id)}"><div class="g-bar ${a.p>=60?'full':''}" style="--c:${c};right:${X(a.s)}%;width:${W(a.s,a.e)}%"><div class="pf" style="width:${a.p}%"></div><div class="pl">${a.p?pct(a.p):''}</div></div>${a.milestone?`<div class="g-ms" style="right:${X(a.e+1)}%"></div>`:''}</div>`;
    });
  });
  const weeks=[];for(let w=lo;w<=hi;w+=7)weeks.push(w);
  const head=`<div class="g-head">${weeks.map((w,i)=>`<div class="g-wk" style="right:${X(w)}%;width:${7/span*100}%"><b>هفته ${fa(i+1)}</b>${fmtDay(w)}</div>`).join('')}</div>`;
  const grid=`<div class="g-grid">${ps!=null&&pe!=null?`<div class="g-phase" style="right:${X(ps)}%;width:${W(ps,pe)}%"></div>`:''}${weeks.map(w=>`<i style="right:${X(w)}%"></i>`).join('')}${T>=lo&&T<=hi?`<div class="g-today" style="right:${X(T)+0.5/span*100}%"><span>امروز</span></div>`:''}</div>`;
  el.innerHTML=`<div class="gscroll"><div class="gantt"><div class="g-lab">${L}</div><div class="g-time">${head}${R}${grid}</div></div></div>`+
    (undated.length?`<div class="undated"><b>بدون تاریخ (${fa(undated.length)}):</b>${undated.map(a=>`<span class="uchip" data-id="${esc(a.id)}">${esc(a.stream)}${SEP}${esc(a.title)}</span>`).join('')}</div>`:'');
}

/* ---------- content calendar ---------- */
function renderCal(T){
  const el=$('cal');
  const q=S.filter.q.trim();
  const items=(S.calendar||[]).map(c=>({...c,n:jday(c.date)})).filter(c=>c.n!=null&&(!q||[c.title,c.desc,c.channel,c.format].join(' ').includes(q))).sort((a,b)=>a.n-b.n||String(a.time).localeCompare(String(b.time)));
  const past=items.filter(c=>c.n<T),up=items.filter(c=>c.n>=T);
  const show=(S.showPast||!up.length)?items:up;
  const chans=[...new Set(items.map(c=>c.channel||'سایر'))];
  let h=`<div class="cal-head"><div><h2>تقویم محتوا</h2><div class="sub">${fa(items.length)} محتوا در ${fa(new Set(items.map(c=>c.n)).size)} روز</div></div><div class="cal-legend">${chans.map(c=>`<span><i style="background:${chColor(c)}"></i>${esc(c)}</span>`).join('')}</div></div>`;
  if(!items.length){el.innerHTML=h+'<div class="cal-empty">هنوز محتوایی در تقویم ثبت نشده</div>';return}
  if(past.length&&up.length)h+=`<div class="cal-more" style="margin-top:14px"><button id="pastTog">${S.showPast?'پنهان کردن روزهای گذشته':`نمایش روزهای گذشته (${fa(new Set(past.map(c=>c.n)).size)} روز)`}</button></div>`;
  let lastMonth='',days={};h+='<div class="cal-days">';
  show.forEach(c=>{(days[c.n]=days[c.n]||[]).push(c)});
  Object.keys(days).map(Number).sort((a,b)=>a-b).forEach(n=>{
    const[y,mo,d]=dayJ(n),mk=y+'-'+mo;
    if(mk!==lastMonth){lastMonth=mk;const cntM=show.filter(c=>{const j=dayJ(c.n);return j[0]===y&&j[1]===mo}).length;h+=`<div class="cal-month">${MONTHS[mo-1]} ${faD(y)} <small>${fa(cntM)} محتوا</small></div>`}
    h+=`<div class="cal-day ${n===T?'today':n<T?'past':''}"><div class="cal-date"><b>${fa(d)}</b><div><span>${WD[wday(n)]}</span><small>${MONTHS[mo-1]}${days[n].length>1?SEP+fa(days[n].length)+' محتوا':''}</small></div>${n===T?'<em>امروز</em>':''}</div><div class="cal-items">${days[n].map(c=>{const col=chColor(c.channel||'سایر');return`<div class="cal-item" data-cal="${esc(c.date+'|'+c.title)}" style="--c:${col}"><div class="meta"><span class="ch"><i></i>${esc(c.channel||'سایر')}</span>${c.format?`<span class="fm">${esc(c.format)}</span>`:''}${c.time?`<span class="tm">${esc(faD(c.time))}</span>`:''}</div><h4>${esc(c.title)}</h4>${c.desc?`<p>${esc(c.desc)}</p>`:''}${c.status?`<span class="pill" style="--c:${stColor(c.status)}">${esc(c.status)}</span>`:''}</div>`}).join('')}</div></div>`;
  });
  h+='</div>';el.innerHTML=h;
  const pt=$('pastTog');if(pt)pt.onclick=()=>{S.showPast=!S.showPast;renderCal(todayN())};
}

/* ---------- interactions ---------- */
function bind(){
  $('filters').querySelectorAll('[data-stream]').forEach(b=>b.onclick=()=>{S.filter.stream=b.dataset.stream;$('filters').querySelectorAll('[data-stream]').forEach(x=>x.classList.toggle('on',x===b));renderDynamic()});
  $('fStatus').onchange=e=>{S.filter.status=e.target.value;renderDynamic()};
  let qt;$('fQ').oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{S.filter.q=e.target.value;renderDynamic()},160)};
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>$(b.dataset.go).scrollIntoView({behavior:'smooth'}));
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{S.view=b.dataset.view;try{localStorage.setItem('star-view',S.view)}catch(e){};document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('on',x===b));renderDynamic()});
  document.querySelectorAll('[data-by]').forEach(b=>b.onclick=()=>{S.by=b.dataset.by;S.closed=null;document.querySelectorAll('[data-by]').forEach(x=>x.classList.toggle('on',x===b));renderDynamic()});
  $('openAll').onclick=()=>{S.closed=new Set();renderDynamic()};
  $('closeAll').onclick=()=>{S.closed=new Set(laneGroups(filtered(visActions()).filter(a=>a.s!=null)).map(g=>g.key));renderDynamic()};
}
document.addEventListener('click',e=>{
  if(e.target.closest('.drawer'))return;
  const ln=e.target.closest('[data-lane]');if(ln){const k=ln.dataset.lane;S.closed.has(k)?S.closed.delete(k):S.closed.add(k);renderDynamic();return}
  const th=e.target.closest('th[data-sort]');if(th){const k=th.dataset.sort;S.sort=S.sort.k===k?{k,d:-S.sort.d}:{k,d:1};renderDynamic();return}
  const ci=e.target.closest('[data-cal]');if(ci){openCal(ci.dataset.cal);return}
  const it=e.target.closest('[data-id]');if(it)openDrawer(it.dataset.id);
});
const tip=$('tip');
document.addEventListener('mouseover',e=>{
  const t=e.target.closest('.g-trk[data-id],.g-row[data-id]');
  document.querySelectorAll('.hl').forEach(x=>x.classList.remove('hl'));
  if(!t){tip.classList.remove('on');return}
  const id=t.dataset.id;document.querySelectorAll(`.g-trk[data-id="${CSS.escape(id)}"],.g-row[data-id="${CSS.escape(id)}"]`).forEach(x=>x.classList.add('hl'));
  const a=visActions().find(x=>x.id===id);if(!a||!t.matches('.g-trk')){tip.classList.remove('on');return}
  tip.innerHTML=`<b>${esc(a.title)}</b>${fmtDay(a.s)}${a.e!==a.s?' تا '+fmtDay(a.e):''}${SEP}${esc(a.status||'')}${SEP}${pct(a.p)}`;tip.classList.add('on');
});
document.addEventListener('mousemove',e=>{if(tip.classList.contains('on')){const w=tip.offsetWidth;tip.style.left=Math.max(8,Math.min(innerWidth-w-8,e.clientX-w/2))+'px';tip.style.top=(e.clientY+18)+'px'}});

function showDrawer(html){$('drawer').innerHTML='<button class="x" id="dx" aria-label="بستن">×</button>'+html;$('drawer').classList.add('on');$('scrim').classList.add('on');$('drawer').setAttribute('aria-hidden','false');$('dx').onclick=closeDrawer}
function openDrawer(id){
  const a=visActions().find(x=>x.id===id);if(!a)return;
  const showBud=(S.meta||{}).showBudget!==false,c=stColor(a.status),link=/^https?:\/\//i.test(a.link||'')?a.link:null;
  showDrawer(`<div class="eyebrow" dir="ltr" style="text-align:right;color:var(--dim)">${esc(a.id)}</div><h3>${esc(a.title)}</h3>
    <span class="pill" style="--c:${c}">${esc(a.status||'—')}</span>${a.milestone?' <span class="pill" style="--c:#C9A800">نقطه‌ی عطف</span>':''}
    <div style="margin-top:18px"><div style="display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px"><span>پیشرفت</span><b style="color:var(--text)">${pct(a.p)}</b></div><div class="bar"><i style="width:${a.p}%;background:${c}"></i></div></div>
    <div class="dgrid"><div><span>جریان کار</span><b>${esc(a.stream)}</b></div><div><span>کانال</span><b>${esc(a.channel||'—')}</b></div>
      <div><span>نوع محتوا</span><b>${esc(a.type||'—')}</b></div><div><span>مسئول</span><b>${esc(a.owner||'تیم لامانا')}</b></div>
      <div><span>شروع</span><b>${a.s!=null?fmtDay(a.s):'هنوز تعیین نشده'}</b></div><div><span>پایان</span><b>${a.e!=null?fmtDay(a.e):'—'}${a.s!=null?` <small style="color:var(--dim)">(${fa(durOf(a))} روز)</small>`:''}</b></div>
      ${showBud?`<div><span>بودجه‌ی مصوب</span><b>${a.bud!=null?money(a.bud)+' تومان':'—'}</b></div><div><span>دریافتی</span><b>${a.rec!=null?money(a.rec)+' تومان':'—'}</b></div><div style="grid-column:1/-1"><span>هزینه‌کرد واقعی</span><b>${a.sp!=null?money(a.sp)+' تومان':'—'}</b></div>`:''}</div>
    ${a.note?`<div class="dnote"><div class="eyebrow" style="margin-bottom:6px;color:var(--accent)">یادداشت</div>${esc(a.note)}</div>`:''}
    ${link?`<p style="margin-top:16px"><a href="${esc(link)}" target="_blank" rel="noopener">مشاهده‌ی لینک ↗</a></p>`:''}`);
}
function openCal(key){
  const c=(S.calendar||[]).find(x=>(x.date+'|'+x.title)===key);if(!c)return;const n=jday(c.date);const link=/^https?:\/\//i.test(c.link||'')?c.link:null;
  showDrawer(`<div class="eyebrow" style="color:${chColor(c.channel||'سایر')}">${esc(c.channel||'')}${c.format?SEP+esc(c.format):''}</div><h3>${esc(c.title)}</h3>
    ${c.status?`<span class="pill" style="--c:${stColor(c.status)}">${esc(c.status)}</span>`:''}
    <div class="dgrid"><div><span>تاریخ انتشار</span><b>${WD[wday(n)]} ${fmtDay(n)}</b></div><div><span>ساعت</span><b>${c.time?esc(faD(c.time)):'—'}</b></div></div>
    ${c.desc?`<div class="dnote">${esc(c.desc)}</div>`:''}${link?`<p style="margin-top:16px"><a href="${esc(link)}" target="_blank" rel="noopener">مشاهده‌ی محتوا ↗</a></p>`:''}`);
}
function closeDrawer(){$('drawer').classList.remove('on');$('scrim').classList.remove('on');$('drawer').setAttribute('aria-hidden','true')}
$('scrim').onclick=closeDrawer;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
let toastT;function toast(msg){const t=$('toast');t.innerHTML=`<span class="dot"></span>${esc(msg)}`;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),4200)}

/* theme */
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>';
function paintTheme(){$('themeBtn').innerHTML=document.documentElement.dataset.theme==='dark'?SUN:MOON}
$('themeBtn').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('star-theme',t)}catch(e){};paintTheme()};
paintTheme();

/* live indicator */
function updLive(){
  if(!S.live)return;const m=S.meta;const el=$('live'),tx=$('liveTxt');
  const mins=m&&m.lastSync?Math.max(0,Math.round((Date.now()-new Date(m.lastSync).getTime())/6e4)):0;
  const rel=mins<1?'همین الان':mins<60?`${fa(mins)} دقیقه پیش`:mins<1440?`${fa(Math.round(mins/60))} ساعت پیش`:`${fa(Math.round(mins/1440))} روز پیش`;
  el.className='live'+(mins>15?' stale':'');tx.innerHTML=`<b>زنده</b> <span class="full">${SEP}به‌روزرسانی </span>${rel}`;
}
setInterval(updLive,30000);

/* ---------- data ---------- */
const API='https://script.google.com/macros/s/AKfycbyo9x2RfcxaE1Hv9sjHu0hL-v5MjZssgz06mvz4qfnjddk1bL6hhvvK99uAnwhJ4xvy/exec';
const POLL=60000;
let okOnce=false,lastSig='';
function apply(d,fromApi){
  const acts=(d.actions||[]).map(a=>clean({...a,id:String(a.id)}));
  const sig=JSON.stringify([acts,d.streams,d.meta,d.calendar]);
  if(fromApi&&okOnce&&sig!==lastSig){
    const old=new Map((S.actions||[]).map(a=>[a.id,JSON.stringify(a)]));const ids=new Set(acts.map(a=>a.id));
    const add=acts.filter(a=>!old.has(a.id)).length,mod=acts.filter(a=>old.has(a.id)&&old.get(a.id)!==JSON.stringify(a)).length,rem=[...old.keys()].filter(k=>!ids.has(k)).length;
    const parts=[];if(add)parts.push(`${fa(add)} اکشن جدید`);if(mod)parts.push(`${fa(mod)} اکشن به‌روز شد`);if(rem)parts.push(`${fa(rem)} اکشن حذف شد`);toast(parts.length?parts.join('، '):'تقویم یا تنظیمات به‌روز شد');
  }
  S.meta=clean({...(d.meta||{}),lastSync:d.updated||new Date().toISOString()});
  if(sig!==lastSig){S.actions=acts;S.streams=(d.streams||[]).map(x=>clean(x));S.calendar=(d.calendar||[]).map(x=>clean(x));lastSig=sig;const y=scrollY;render();scrollTo(0,y)}
}
async function pull(){
  const r=await fetch(API+(API.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store',redirect:'follow'});
  if(!r.ok)throw new Error('http '+r.status);
  const d=await r.json();
  S.live=true;S.err=null;apply(d,true);okOnce=true;updLive();
}
function useSnapshot(){
  let snap=null;try{snap=JSON.parse($('snap').textContent)}catch(e){}
  if(!(snap&&snap.actions))return false;
  apply(snap,false);$('live').className='live off';$('liveTxt').innerHTML='<b>نسخه‌ی ثابت</b><span class="full">'+SEP+'در حال تلاش برای اتصال</span>';return true;
}
(async()=>{
  const timer=setTimeout(()=>{if(!okOnce&&S.actions==null)useSnapshot()},8000);
  const tick=async()=>{try{await pull();clearTimeout(timer)}catch(e){if(!okOnce){clearTimeout(timer);if(S.actions==null&&!useSnapshot()){S.err='اتصال به داده‌ها برقرار نشد. چند لحظه بعد دوباره صفحه را باز کنید.';render()}}else $('live').className='live stale'}};
  if(!API||API.indexOf('/*')===0){useSnapshot();return}
  await tick();
  setInterval(()=>{if(!document.hidden)tick()},POLL);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
})();
</script>
