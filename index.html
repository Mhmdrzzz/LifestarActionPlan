<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>استار · اکشن‌پلن فاز دوم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0916;--bg2:#100C20;--panel:rgba(26,20,48,.72);--panel-s:#161129;--line:rgba(185,163,247,.12);--line2:rgba(185,163,247,.22);
  --text:#F4F1FF;--muted:#A9A2C8;--dim:#726B95;
  --v1:#B9A3F7;--v2:#8256EE;--v3:#5326C4;--pink:#E0197D;--yel:#FFE401;
  --r:20px;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,system-ui,sans-serif;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden;background:
  radial-gradient(900px 520px at 85% -8%,rgba(130,86,238,.34),transparent 62%),
  radial-gradient(700px 420px at 8% 4%,rgba(224,25,125,.16),transparent 60%),
  radial-gradient(900px 600px at 50% 110%,rgba(83,38,196,.22),transparent 60%),var(--bg);background-repeat:no-repeat}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;background-image:radial-gradient(rgba(255,255,255,.55) .6px,transparent .8px);background-size:46px 46px;mask-image:linear-gradient(to bottom,#000,transparent 70%)}
a{color:var(--v1)}
button{font-family:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:22px 28px 60px;position:relative}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:6px 0 22px}
.brand{display:flex;align-items:center;gap:14px}
.mark{display:flex;align-items:baseline;gap:8px;font-weight:900;letter-spacing:.04em}
.mark .ls{font-size:22px;background:linear-gradient(90deg,#fff,var(--v1));-webkit-background-clip:text;background-clip:text;color:transparent;direction:ltr}
.mark .x{color:var(--dim);font-weight:400;font-size:16px}
.mark .lm{font-size:15px;color:var(--yel);direction:ltr;letter-spacing:.18em}
.live{display:flex;align-items:center;gap:10px;padding:8px 14px;border:1px solid var(--line2);border-radius:999px;background:rgba(20,16,38,.7);backdrop-filter:blur(10px);font-size:12.5px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:#3DDC84;box-shadow:0 0 0 0 rgba(61,220,132,.6);animation:pulse 2s infinite}
.live.stale .dot{background:#F5A524;animation:none}
.live.off .dot{background:#726B95;animation:none}
.live b{color:var(--text);font-weight:600}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,132,.55)}70%{box-shadow:0 0 0 9px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(14px);position:relative}
.card.pad{padding:24px}
.h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 18px}
.h h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em}
.h .sub{color:var(--dim);font-size:12.5px}
.eyebrow{font-size:11.5px;letter-spacing:.14em;color:var(--v1);font-weight:700;text-transform:uppercase}

/* hero */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.hero-main{padding:34px 34px 30px;overflow:hidden}
.hero-main::after{content:"";position:absolute;inset:auto -80px -120px auto;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(255,228,1,.13),transparent 65%);pointer-events:none}
.hero h1{font-size:44px;line-height:1.15;margin:10px 0 10px;font-weight:900;letter-spacing:-.02em}
.hero h1 span{background:linear-gradient(95deg,#fff 10%,var(--v1) 55%,#FF7FBF);-webkit-background-clip:text;background-clip:text;color:transparent}
.dates{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;border:1px solid var(--line2);font-size:12.5px;color:var(--muted);background:rgba(255,255,255,.03)}
.note{margin-top:22px;padding:16px 18px;border-radius:14px;background:linear-gradient(135deg,rgba(130,86,238,.18),rgba(224,25,125,.08));border:1px solid rgba(185,163,247,.22);font-size:14.5px;line-height:1.9}
.note .eyebrow{display:block;margin-bottom:4px;color:var(--yel)}
.hero-side{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;padding:30px 34px}
.ring{position:relative;width:200px;height:200px}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-size:52px;font-weight:900;line-height:1}
.ring .sm{color:var(--muted);font-size:13px;margin-top:6px}
.phase-meta{display:grid;gap:14px}
.pm{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px dashed var(--line);padding-bottom:10px}
.pm:last-child{border-bottom:0}
.pm span{color:var(--muted);font-size:13px}
.pm b{font-size:18px;font-weight:800}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:20px}
.kpi{padding:20px 22px;overflow:hidden}
.kpi .lab{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:8px}
.kpi .val{font-size:34px;font-weight:900;margin-top:6px;line-height:1.1;letter-spacing:-.01em}
.kpi .val small{font-size:15px;color:var(--muted);font-weight:500;margin-right:4px}
.kpi .foot{margin-top:10px;font-size:12px;color:var(--dim)}
.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--v2),#FF5FAE);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.kpi .ico{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:rgba(130,86,238,.18);color:var(--v1)}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;margin-bottom:20px;position:sticky;top:10px;z-index:20;background:rgba(18,14,34,.86)}
.fgroup{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fbtn{border:1px solid var(--line2);background:transparent;color:var(--muted);padding:7px 14px;border-radius:999px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--v1)}
.fbtn.on{background:var(--text);color:#120E24;border-color:var(--text);font-weight:700}
.fbtn .sw{width:8px;height:8px;border-radius:50%}
select,input[type=search]{font-family:inherit;font-size:12.5px;background:rgba(255,255,255,.04);border:1px solid var(--line2);color:var(--text);border-radius:999px;padding:7px 14px;outline:none}
select:focus,input:focus{border-color:var(--v1)}
select option{background:#1B1533}
input[type=search]{width:200px}
.nav{display:flex;gap:4px}
.nav button{background:none;border:0;color:var(--muted);font-size:12.5px;padding:7px 10px;border-radius:10px;cursor:pointer}
.nav button:hover{color:var(--text);background:rgba(255,255,255,.05)}

/* gantt */
.gantt-scroll{overflow-x:auto;border-radius:14px;border:1px solid var(--line)}
.gantt{display:grid;grid-template-columns:260px 1fr;min-width:980px;background:rgba(10,8,22,.45)}
.g-labels{border-left:1px solid var(--line);position:sticky;right:0;z-index:3;background:#120E24}
.g-time{position:relative}
.g-head{height:52px;border-bottom:1px solid var(--line);position:relative}
.g-labels .g-head{display:flex;align-items:flex-end;padding:0 16px 10px;color:var(--dim);font-size:12px}
.g-wk{position:absolute;top:0;bottom:0;border-right:1px solid var(--line);padding:8px 8px 0;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden}
.g-wk b{display:block;color:var(--text);font-weight:700;font-size:12px}
.g-lane{height:40px;display:flex;align-items:center;gap:9px;padding:0 16px;font-weight:800;font-size:12.5px;white-space:nowrap;overflow:hidden;border-bottom:1px solid var(--line);background:rgba(255,255,255,.025)}
.g-lane .sw{width:10px;height:10px;border-radius:3px}
.g-lane .cnt{color:var(--dim);font-weight:500;font-size:11px;margin-right:auto;flex:none}
.g-lane .nm{overflow:hidden;text-overflow:ellipsis}
.sep{display:inline-block;width:1px;height:11px;background:currentColor;opacity:.45;margin:0 8px;vertical-align:-1px}
.g-row{height:38px;border-bottom:1px solid rgba(185,163,247,.06);display:flex;align-items:center;padding:0 16px;gap:8px;font-size:12.5px;cursor:pointer;white-space:nowrap;overflow:hidden}
.g-row:hover,.g-row.hl{background:rgba(130,86,238,.12)}
.g-row .id{color:var(--dim);font-size:11px;direction:ltr;min-width:34px;font-feature-settings:"tnum"}
.g-row .t{overflow:hidden;text-overflow:ellipsis}
.g-track{height:38px;border-bottom:1px solid rgba(185,163,247,.06);position:relative;cursor:pointer}
.g-track.lane{height:40px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.025);cursor:default}
.g-track:not(.lane):hover,.g-track.hl{background:rgba(130,86,238,.12)}
.g-grid{position:absolute;inset:52px 0 0 0;pointer-events:none}
.g-grid i{position:absolute;top:0;bottom:0;border-right:1px solid rgba(185,163,247,.07)}
.g-phase{position:absolute;top:0;bottom:0;background:linear-gradient(180deg,rgba(130,86,238,.07),rgba(130,86,238,.02));border-left:1px dashed rgba(185,163,247,.3);border-right:1px dashed rgba(185,163,247,.3)}
.g-today{position:absolute;top:0;bottom:0;width:0;border-right:2px solid var(--yel);z-index:2;filter:drop-shadow(0 0 6px rgba(255,228,1,.6))}
.g-today span{position:absolute;top:-11px;right:-22px;background:var(--yel);color:#141026;font-weight:800;font-size:10.5px;padding:1px 7px;border-radius:6px;white-space:nowrap}
.g-bar{position:absolute;top:8px;height:22px;border-radius:7px;overflow:hidden;min-width:8px;box-shadow:0 4px 14px rgba(0,0,0,.35);transition:transform .15s}
.g-bar::before{content:"";position:absolute;inset:0;background:var(--c);opacity:.35}
.g-bar .pf{position:absolute;top:0;bottom:0;right:0;background:var(--c)}
.g-bar .pl{position:absolute;inset:0;display:flex;align-items:center;padding:0 8px;font-size:10.5px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);white-space:nowrap}
.g-track:hover .g-bar{transform:scaleY(1.12)}
.g-ms{position:absolute;top:10px;width:16px;height:16px;transform:translateX(50%) rotate(45deg);background:var(--yel);border-radius:3px;box-shadow:0 0 12px rgba(255,228,1,.7)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;color:var(--muted);font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* week cards */
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:20px 0}
.wk-list{display:grid;gap:10px}
.wk-item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--line);cursor:pointer;transition:.18s}
.wk-item:hover{border-color:var(--line2);background:rgba(130,86,238,.1);transform:translateX(-2px)}
.wk-item .st{width:4px;align-self:stretch;border-radius:4px}
.wk-item .tt{font-weight:600;font-size:13.5px}
.wk-item .mt{color:var(--dim);font-size:11.5px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;background:color-mix(in srgb,var(--c) 18%,transparent);color:color-mix(in srgb,var(--c) 70%,#fff);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.empty{color:var(--dim);font-size:13px;padding:18px;text-align:center;border:1px dashed var(--line2);border-radius:14px}

/* budget */
.bud{display:grid;gap:18px}
.bud-row .top2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.bud-row .nm{font-weight:700;display:flex;align-items:center;gap:8px}
.bud-row .nm .sw{width:10px;height:10px;border-radius:3px}
.bud-row .nums{color:var(--muted);font-size:12.5px}
.bud-row .nums b{color:var(--text)}
.bbar{height:12px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden;position:relative}
.bbar i{position:absolute;top:0;bottom:0;right:0;border-radius:99px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bud-total{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px;padding-top:16px;border-top:1px solid var(--line)}
.bud-total div{text-align:center}
.bud-total span{display:block;color:var(--muted);font-size:12px}
.bud-total b{font-size:20px;font-weight:900}

/* kpi targets */
.kt{display:grid;gap:14px}
.kt-row .top2{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:6px}
.kt-row .top2 span{color:var(--muted)}
.kt-bar{height:10px;border-radius:99px;background:rgba(255,255,255,.06);position:relative;overflow:visible}
.kt-bar i{position:absolute;top:0;bottom:0;right:0;border-radius:99px;background:linear-gradient(90deg,#22C7B8,#3DDC84)}
.kt-bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text);border-radius:2px}

/* board + table */
.viewtog{display:inline-flex;border:1px solid var(--line2);border-radius:12px;padding:3px}
.viewtog button{border:0;background:none;color:var(--muted);padding:6px 14px;border-radius:9px;cursor:pointer;font-size:12.5px}
.viewtog button.on{background:var(--v2);color:#fff;font-weight:700}
.board{display:grid;grid-template-columns:repeat(6,minmax(190px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:16px;padding:12px;min-height:160px;max-height:620px;overflow-y:auto;scrollbar-width:thin}
.col h3{margin:0 0 10px;font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:6px}
.col h3 .n{color:var(--dim);font-weight:600}
.col h3 .lab{display:flex;align-items:center;gap:7px}
.col h3 .lab i{width:8px;height:8px;border-radius:50%}
.tcard{background:var(--panel-s);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:9px;cursor:pointer;transition:.18s}
.tcard:hover{border-color:var(--v1);transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.35)}
.tcard .tt{font-weight:600;font-size:12.5px;line-height:1.6}
.tcard .mt{display:flex;justify-content:space-between;color:var(--dim);font-size:11px;margin-top:6px}
.tcard .mini{height:4px;border-radius:9px;background:rgba(255,255,255,.07);margin-top:8px;overflow:hidden}
.tcard .mini i{display:block;height:100%;background:var(--c)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:900px}
th{text-align:right;color:var(--dim);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line2);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--text)}
td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover{background:rgba(130,86,238,.1)}
td.num{font-feature-settings:"tnum"}
.prog{display:flex;align-items:center;gap:8px}
.prog .bar{width:70px;margin:0;height:5px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,3,12,.6);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.25s;z-index:50}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(460px,100%);background:#120E24;border-right:1px solid var(--line2);z-index:51;transform:translateX(-102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);overflow-y:auto;padding:26px}
.drawer.on{transform:none}
.drawer .x{position:absolute;top:18px;left:18px;width:34px;height:34px;border-radius:10px;border:1px solid var(--line2);background:none;color:var(--text);cursor:pointer;font-size:18px}
.drawer h3{font-size:22px;margin:14px 0 12px;line-height:1.4;font-weight:800}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.dgrid div{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.dgrid span{display:block;color:var(--dim);font-size:11.5px}
.dgrid b{font-size:14px;font-weight:700}
.dnote{background:linear-gradient(135deg,rgba(130,86,238,.16),rgba(224,25,125,.07));border:1px solid var(--line2);border-radius:14px;padding:14px;line-height:1.9}

/* toast + tooltip + states */
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,30px);opacity:0;background:#1F1838;border:1px solid var(--line2);padding:11px 18px;border-radius:14px;font-size:13px;z-index:60;transition:.3s;box-shadow:0 14px 40px rgba(0,0,0,.45);display:flex;gap:9px;align-items:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.tip{position:fixed;pointer-events:none;z-index:70;background:#1F1838;border:1px solid var(--line2);border-radius:12px;padding:10px 12px;font-size:12px;max-width:280px;opacity:0;transition:opacity .12s;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.tip.on{opacity:1}
.tip b{display:block;font-size:13px;margin-bottom:4px}
.tip span{color:var(--muted)}
.state{padding:70px 20px;text-align:center;color:var(--muted)}
.state .spin{width:38px;height:38px;border-radius:50%;border:3px solid rgba(185,163,247,.2);border-top-color:var(--v1);margin:0 auto 16px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flash{animation:flash 1.6s ease}
@keyframes flash{0%{box-shadow:0 0 0 2px var(--yel)}100%{box-shadow:0 0 0 0 transparent}}
section{scroll-margin-top:80px}
.foot{display:flex;justify-content:space-between;color:var(--dim);font-size:12px;margin-top:36px;padding-top:18px;border-top:1px solid var(--line)}
.fade{animation:fade .6s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media (max-width:1000px){
  .hero,.two{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .hero-side{grid-template-columns:1fr;justify-items:center}
  .phase-meta{width:100%}
  .nav{display:none}
}
@media (max-width:560px){
  .wrap{padding:14px 14px 40px}
  .hero h1{font-size:32px}
  .hero-main,.hero-side{padding:24px}
  .kpis{gap:12px}
  .kpi{padding:16px}
  .kpi .val{font-size:26px}
  .card.pad{padding:18px}
  input[type=search]{width:100%}
  .filters{position:static}
  .live .full{display:none}
  .gantt{grid-template-columns:150px 1fr;min-width:820px}
  .g-row .id{display:none}
  .g-lane .cnt{display:none}
  .mark .ls{font-size:18px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark"><span class="ls">STAR</span><span class="x">×</span><span class="lm">LAMANA</span></div>
    </div>
    <div class="live off" id="live"><span class="dot"></span><span id="liveTxt">در حال اتصال…</span></div>
  </header>

  <div id="root">
    <div class="card state"><div class="spin"></div>در حال بارگذاری اکشن‌پلن…</div>
  </div>

  <div class="foot"><span>اکشن‌پلن زنده‌ی فاز دوم کمپین استار</span><span>تهیه‌شده توسط آژانس دیجیتال لامانا</span></div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>

function renderGantt(list,streams,m,T){
  const el=$('gantt');
  const dated=list.filter(a=>a.s!=null);
  const ps=jday(m.start),pe=jday(m.end);
  if(!dated.length&&ps==null){el.innerHTML='<div class="empty">برای اکشن‌ها هنوز تاریخ ثبت نشده</div>';return}
  let lo=Math.min(...dated.map(a=>a.s),ps??Infinity,T),hi=Math.max(...dated.map(a=>a.e??a.s),pe??-Infinity);
  lo=satOf(lo);hi=satOf(hi)+6;
  const span=hi-lo+1,X=n=>((n-lo)/span*100);
  const weeks=[];for(let w=lo;w<=hi;w+=7)weeks.push(w);
  let labels='<div class="g-head">اکشن</div>',tracks='';
  streams.forEach(s=>{
    const acts=dated.filter(a=>a.stream===s.name).sort((a,b)=>a.s-b.s||String(a.id).localeCompare(b.id));
    if(!acts.length)return;
    labels+=`<div class="g-lane"><span class="sw" style="background:${s.color}"></span><span class="nm">${esc(s.name)}</span><span class="cnt">${fa(acts.length)} اکشن</span></div>`;
    tracks+='<div class="g-track lane"></div>';
    acts.forEach(a=>{
      const c=stColor(a.status),e=a.e??a.s;
      labels+=`<div class="g-row" data-id="${esc(a.id)}"><span class="id">${esc(a.id)}</span><span class="t">${esc(a.title)}</span></div>`;
      tracks+=`<div class="g-track" data-id="${esc(a.id)}"><div class="g-bar" style="--c:${c};right:${X(a.s)}%;width:${(e-a.s+1)/span*100}%"><div class="pf" style="width:${a.p}%"></div><div class="pl">${a.p?pct(a.p):''}</div></div>${a.milestone?`<div class="g-ms" style="right:${X(e+1)}%"></div>`:''}</div>`;
    });
  });
  const head=`<div class="g-head">${weeks.map((w,i)=>`<div class="g-wk" style="right:${X(w)}%;width:${7/span*100}%"><b>هفته ${fa(i+1)}</b>${fmtDay(w)}</div>`).join('')}</div>`;
  const grid=`<div class="g-grid">${ps!=null&&pe!=null?`<div class="g-phase" style="right:${X(ps)}%;width:${(pe-ps+1)/span*100}%"></div>`:''}${weeks.map(w=>`<i style="right:${X(w)}%"></i>`).join('')}${T>=lo&&T<=hi?`<div class="g-today" style="right:${X(T)+0.5/span*100}%"><span>امروز</span></div>`:''}</div>`;
  el.innerHTML=`<div class="gantt-scroll"><div class="gantt"><div class="g-labels">${labels}</div><div class="g-time">${head}${tracks}${grid}</div></div></div>`;
}

const clean=o=>{const r={};for(const k in o){const v=o[k];r[k]=typeof v==='string'?v.replace(/\u0644\u0627\u06cc\u0641\s*\u200c?\s*\u0627\u0633\u062a\u0627\u0631/g,'استار').replace(/life\s*star/gi,'Star'):v}return r};
const API='https://script.google.com/macros/s/AKfycbyo9x2RfcxaE1Hv9sjHu0hL-v5MjZssgz06mvz4qfnjddk1bL6hhvvK99uAnwhJ4xvy/exec';
const POLL=60000;
let okOnce=false,lastSig='';
async function pull(){
  const r=await fetch(API+(API.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store',redirect:'follow'});
  if(!r.ok)throw new Error('http '+r.status);
  const d=await r.json();
  const acts=(d.actions||[]).map(a=>clean({...a,id:String(a.id)}));
  const sig=JSON.stringify([acts,d.streams,d.meta]);
  if(okOnce&&sig!==lastSig){
    const old=new Map((S.actions||[]).map(a=>[a.id,JSON.stringify(a)]));const ids=new Set(acts.map(a=>a.id));
    const add=acts.filter(a=>!old.has(a.id)).length,mod=acts.filter(a=>old.has(a.id)&&old.get(a.id)!==JSON.stringify(a)).length,rem=[...old.keys()].filter(k=>!ids.has(k)).length;
    const parts=[];if(add)parts.push(`${fa(add)} اکشن جدید`);if(mod)parts.push(`${fa(mod)} اکشن به‌روز شد`);if(rem)parts.push(`${fa(rem)} اکشن حذف شد`);if(parts.length)toast(parts.join('، '));
  }
  S.meta=clean({...(d.meta||{}),lastSync:d.updated||new Date().toISOString()});
  S.live=true;S.err=null;
  if(sig!==lastSig||!okOnce){S.actions=acts;S.streams=(d.streams||[]).map((x,i)=>clean({key:'s'+(i+1),...x}));lastSig=sig;
    if(!okOnce){S.first=false;render()}else{const y=scrollY;render();scrollTo(0,y)}}
  okOnce=true;updLive();
}
function useSnapshot(){
  let snap=null;try{snap=JSON.parse(document.getElementById('snap').textContent)}catch(e){}
  if(!(snap&&snap.actions))return false;
  S.actions=Object.entries(snap.actions).map(([id,d])=>clean({id,...d}));S.streams=Object.entries(snap.streams||{}).map(([key,d])=>clean({key,...d}));S.meta=clean(snap.meta||{});S.first=false;render();
  $('live').className='live off';$('liveTxt').innerHTML='<b>نسخه‌ی ثابت</b><span class="full">'+SEP+'در حال تلاش برای اتصال</span>';return true;
}
(async()=>{
  loadTimer=setTimeout(()=>{if(!okOnce&&S.actions==null)useSnapshot()},10000);
  const tick=async()=>{try{await pull();clearTimeout(loadTimer)}catch(e){if(!okOnce){clearTimeout(loadTimer);if(S.actions==null&&!useSnapshot()){S.err='اتصال به داده‌ها برقرار نشد. چند لحظه بعد دوباره صفحه را باز کنید.';render()}}else{$('live').className='live stale'}}};
  await tick();
  setInterval(()=>{if(!document.hidden)tick()},POLL);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
})();
</script>
